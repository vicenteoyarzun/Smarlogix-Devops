version: '3.8'

services:
  usuario:
    build:
      context: .
      dockerfile: ../Dockerfile.backend
    container_name: smartlogix-usuario
    environment:
      SPRING_APPLICATION_NAME: usuario
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    networks:
      - smartlogix-usuario-net

networks:
  smartlogix-usuario-net:
    driver: bridge
