version: '3.8'

services:
  pedidos:
    build:
      context: .
      dockerfile: ../Dockerfile.backend
    container_name: smartlogix-pedidos
    environment:
      SPRING_APPLICATION_NAME: pedidos
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    networks:
      - smartlogix-pedidos-net

networks:
  smartlogix-pedidos-net:
    driver: bridge
