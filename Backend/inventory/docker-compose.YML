version: '3.8'

services:
  inventario:
    build:
      context: .
      dockerfile: ../Dockerfile.backend
    container_name: smartlogix-inventario
    environment:
      SPRING_APPLICATION_NAME: inventario
      SERVER_PORT: 8080
    ports:
      - "8083:8080"
    networks:
      - smartlogix-inventario-net

networks:
  smartlogix-inventario-net:
    driver: bridge
