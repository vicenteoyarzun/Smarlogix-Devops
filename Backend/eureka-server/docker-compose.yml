version: '3.8'

services:
  eureka-server:
    build:
      context: .
      dockerfile: ../Dockerfile.eureka
    container_name: smartlogix-eureka
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: 8080
    ports:
      - "8085:8080"
    networks:
      - smartlogix-eureka-net

networks:
  smartlogix-eureka-net:
    driver: bridge
